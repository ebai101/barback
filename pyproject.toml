[project]
name = "barback"
version = "0.1.0"
description = "Audio validator for Splice"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
  "librosa>=0.11.0",
  "pedalboard>=0.9.22",
  "platformdirs>=4.3.6",
  "sounddevice>=0.5.5",
  "textual>=0.85.1",
  "watchfiles>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["textual-dev>=1.8.0"]

[project.scripts]
barback = "barback:main"
