[project]
name = "barback"
version = "0.1.0"
description = "Audio validator for Splice"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
  "librosa>=0.11.0",
  "loky>=3.4.1",
  "textual>=0.85.1",
  "watchfiles>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
barback = "barback:main"

[tool.basedpyright]
include = ["src"]
reportMissingImports = "error"
reportMissingTypeStubs = false
