[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "barback"
version = "0.1.0"
description = "Barback audio processor"
requires-python = ">=3.10"
dependencies = [
    "audioread==3.0.1",
    "certifi==2024.8.30",
    "cffi==1.17.1",
    "charset-normalizer==3.4.0",
    "decorator==5.1.1",
    "idna==3.10",
    "joblib==1.4.2",
    "lazy_loader==0.4",
    "librosa==0.10.2.post1",
    "linkify-it-py==2.0.3",
    "llvmlite==0.43.0",
    "markdown-it-py==3.0.0",
    "mdit-py-plugins==0.4.2",
    "mdurl==0.1.2",
    "msgpack==1.1.0",
    "numba==0.60.0",
    "numpy==2.0.2",
    "packaging==24.1",
    "pandas==2.2.2",
    "platformdirs==4.3.6",
    "pooch==1.8.2",
    "pycparser==2.22",
    "Pygments==2.18.0",
    "python-dateutil==2.9.0.post0",
    "pytz==2024.2",
    "requests==2.32.3",
    "rich==13.9.2",
    "scikit-learn==1.5.2",
    "scipy==1.14.1",
    "six==1.16.0",
    "soundfile==0.12.1",
    "soxr==0.5.0.post1",
    "textual==0.83.0",
    "threadpoolctl==3.5.0",
    "typing_extensions==4.12.2",
    "tzdata==2024.2",
    "uc-micro-py==1.0.3",
    "urllib3==2.2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true

[project.scripts]
my-app = "barback.__main__:main"
