# Barback Configuration File
# This file is automatically generated on first run

# Theme selection - theme names can be found by entering the
# command palette (Ctrl+\) and choosing one from the theme picker.
# This variable just sets which theme is applied on startup.
theme = "tokyo-night"

# Log verbosity - logs can be found at ~/.barback/logs/barback.log
# Options: "DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"
log_level = "INFO"

[repairs.sr_bd]
enabled = true
# Path to a Goodhertz Good Dither 3 plugin. Can be an AU .component
# as well. If the plugin is not found, Barback will use TPDF dithering.
good_dither_path = "/Library/Audio/Plug-Ins/VST3/Ghz Good Dither 3.vst3"

[repairs.silence]
enabled = true

[repairs.microfades]
enabled = true
# Set the length of applied microfades
fade_in_duration = 15
fade_out_duration = 30

[repairs.loop]
enabled = true

[repairs.keysig]
enabled = true

# Application configurations
# You can add up to 10 applications for opening audio files
# Each app needs:
#   - display_name: Short name shown in the footer (e.g., "RX")
#   - application_name: Exact name as shown in Finder (e.g., "iZotope RX 11 Audio Editor")
#   - max_files: Optional limit to the number of files opened at a time
#
# The first app will be bound to key "1", second to "2", etc.
# Shift + number (e.g., "!") opens all files with a specific issue type
[[apps]]
display_name = "RX"
application_name = "iZotope RX 11 Audio Editor"
max_files = 32                                  # RX only supports 32 open files at a time

[[apps]]
display_name = "Myriad"
application_name = "Myriad"

